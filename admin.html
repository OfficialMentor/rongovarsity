<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Rongo University Voting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- keep your styles here -->
</head>
<body>

<!-- TOP BAR -->
<div class="top">
  <div class="top-left">
    <div class="logo-circle">RU</div>
    <div class="logo-text">
      <span>Rongo University</span>
      <span>Admin Panel</span>
    </div>
  </div>
  <button class="btn-small hidden" id="logoutBtn">Logout</button>
</div>

<div class="page">

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <div class="card-title">Admin Login</div>
    <div class="card-subtitle">Enter admin password</div>
    <div class="field-label">Password</div>
    <input type="password" id="adminPass" required>
    <button class="btn" id="loginBtn">Login</button>
  </div>

  <!-- ADMIN CONTROLS -->
  <div class="card hidden" id="adminCard">
    <div class="card-title">Election Setup</div>

    <!-- Election Title -->
    <div class="field-label">Election Title</div>
    <input type="text" id="electionTitle">
    <button class="btn" id="saveTitleBtn">Save Title</button>
    <hr>

    <!-- Seats -->
    <div class="card-subtitle">Seats / Positions</div>
    <input type="text" id="seatName" placeholder="Seat name">
    <button class="btn" id="addSeatBtn">Add Seat</button>
    <ul class="list" id="seatsList"></ul>
    <hr>

    <!-- Candidates -->
    <div class="card-subtitle">Candidates</div>
    <select id="seatSelect"></select>
    <input type="text" id="candidateName" placeholder="Candidate name">
    <button class="btn" id="addCandidateBtn">Add Candidate</button>
    <ul class="list" id="candidatesList"></ul>
    <hr>

    <!-- Voters -->
    <div class="card-subtitle">Register Voter</div>
    <input type="text" id="voterAdm" placeholder="Admission number">
    <input type="text" id="voterName" placeholder="Student name">
    <button class="btn" id="addVoterBtn">Add Voter</button>
    <ul class="list" id="votersList"></ul>
    <hr>

    <!-- Reset Voter Password -->
    <div class="card-subtitle">Reset Voter Password</div>
    <input type="text" id="resetAdm" placeholder="Admission number">
    <button class="btn" id="resetPassBtn">Reset Password</button>
    <hr>

    <!-- Admin Password -->
    <div class="card-subtitle">Admin Accounts</div>
    <input type="password" id="newAdminPass" placeholder="New admin password">
    <button class="btn" id="addAdminBtn">Add Admin Account</button>
    <hr>

    <!-- Logs -->
    <div class="card-subtitle">System Logs</div>
    <div id="logsList" style="font-size:12px; color:var(--text-muted); max-height:200px; overflow-y:auto;"></div>

    <hr>
    <!-- Reset Election -->
    <button class="btn-danger" id="resetElectionBtn">Reset Entire Election</button>
  </div>
</div>

<!-- POPUPS (success/error etc.) -->
<div class="popup-overlay" id="successOverlay">
  <div class="popup" id="successBox">
    <div class="popup-icon" id="successIcon">✔</div>
    <div class="popup-title" id="successTitle">Success</div>
    <div class="popup-text" id="successText">Action completed.</div>
  </div>
</div>

<!-- Firebase + Admin logic -->
<script type="module" src="./firebase.js"></script>
<script type="module" src="./admin.js"></script>

</body>
</html>

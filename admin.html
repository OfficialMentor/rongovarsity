<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Rongo University Voting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Correct single style block -->
  <style>
    :root {
      --bg-main: #050814;
      --bg-card: #0b1020;
      --accent: #1e90ff;
      --accent-strong: #4cc3ff;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-soft: #1f2937;
      --danger: #ff4b5c;
    }

    body {
      margin:0;
      font-family:system-ui,sans-serif;
      background:radial-gradient(circle at top,#0b1530 0,#050814 45%,#02030a 100%);
      color:var(--text-main);
    }

    .hidden { display:none; }

    .top {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; background:#020617f5; border-bottom:1px solid #1f2937;
    }

    .top-left { display:flex; gap:8px; align-items:center; }

    .logo-circle {
      width:36px; height:36px; border-radius:50%; border:2px solid var(--accent);
      display:flex; align-items:center; justify-content:center;
      color:var(--accent-strong); font-size:11px;
    }

    .logo-text { display:flex; flex-direction:column; line-height:1.1; }
    .logo-text span:first-child { font-size:13px; font-weight:600; text-transform:uppercase; }
    .logo-text span:last-child { font-size:11px; color:var(--text-muted); }

    .btn-small {
      border:1px solid var(--accent); background:transparent; color:var(--accent-strong);
      padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px;
    }

    .page { max-width:900px; margin:20px auto; padding:0 16px; }

    .card {
      background:#020617; border-radius:14px; border:1px solid var(--border-soft);
      padding:16px; margin-bottom:16px;
      box-shadow:0 18px 40px rgba(0,0,0,0.7);
    }

    .card-title { font-size:15px; font-weight:600; color:var(--accent-strong); margin-bottom:4px; }
    .card-subtitle { font-size:12px; color:var(--text-muted); margin-bottom:10px; }
    .field-label { font-size:12px; color:var(--text-muted); margin-bottom:3px; }

    input,select {
      width:100%; padding:7px 9px; border-radius:8px; border:1px solid #1f2937;
      background:#020617; color:var(--text-main); font-size:13px;
    }

    input:focus,select:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(30,144,255,0.4);
      outline:none;
    }

    .btn {
      border:none; border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer;
      background:linear-gradient(135deg,#1e90ff,#4cc3ff); color:#020617; font-weight:600;
      margin-top:6px; box-shadow:0 8px 18px rgba(30,144,255,0.4);
    }

    .btn-danger {
      background:linear-gradient(135deg,#ff4b5c,#ff7b7b); color:#020617;
      box-shadow:0 8px 18px rgba(255,75,92,0.4);
    }

    /* Keep the rest of your list, popup, and button styles here */
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top">
  <div class="top-left">
    <div class="logo-circle">RU</div>
    <div class="logo-text">
      <span>Rongo University</span>
      <span>Admin Panel</span>
    </div>
  </div>
  <button class="btn-small hidden" id="logoutBtn">Logout</button>
</div>

<div class="page">

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <div class="card-title">Admin Login</div>
    <div class="card-subtitle">Enter admin password</div>
    <div class="field-label">Password</div>
    <input type="password" id="adminPass" required>
    <button class="btn" id="loginBtn">Login</button>
  </div>

  <!-- ADMIN CONTROLS -->
  <div class="card hidden" id="adminCard">
    <div class="card-title">Election Setup</div>

    <!-- Election Title -->
    <div class="field-label">Election Title</div>
    <input type="text" id="electionTitle">
    <button class="btn" id="saveTitleBtn">Save Title</button>
    <hr>

    <!-- Seats -->
    <div class="card-subtitle">Seats / Positions</div>
    <input type="text" id="seatName" placeholder="Seat name">
    <button class="btn" id="addSeatBtn">Add Seat</button>
    <ul class="list" id="seatsList"></ul>
    <hr>

    <!-- Candidates -->
    <div class="card-subtitle">Candidates</div>
    <select id="seatSelect"></select>
    <input type="text" id="candidateName" placeholder="Candidate name">
    <button class="btn" id="addCandidateBtn">Add Candidate</button>
    <ul class="list" id="candidatesList"></ul>
    <hr>

    <!-- Voters -->
    <div class="card-subtitle">Register Voter</div>
    <input type="text" id="voterAdm" placeholder="Admission number">
    <input type="text" id="voterName" placeholder="Student name">
    <button class="btn" id="addVoterBtn">Add Voter</button>
    <ul class="list" id="votersList"></ul>
    <hr>

    <!-- Reset Voter Password -->
    <div class="card-subtitle">Reset Voter Password</div>
    <input type="text" id="resetAdm" placeholder="Admission number">
    <button class="btn" id="resetPassBtn">Reset Password</button>
    <hr>

    <!-- Admin Password -->
    <div class="card-subtitle">Admin Accounts</div>
    <input type="password" id="newAdminPass" placeholder="New admin password">
    <button class="btn" id="addAdminBtn">Add Admin Account</button>
    <hr>

    <!-- Logs -->
    <div class="card-subtitle">System Logs</div>
    <div id="logsList" style="font-size:12px; color:var(--text-muted); max-height:200px; overflow-y:auto;"></div>

    <hr>
    <!-- Reset Election -->
    <button class="btn-danger" id="resetElectionBtn">Reset Entire Election</button>
  </div>
</div>

<!-- POPUPS (success/error etc.) -->
<div class="popup-overlay" id="successOverlay">
  <div class="popup" id="successBox">
    <div class="popup-icon" id="successIcon">✔</div>
    <div class="popup-title" id="successTitle">Success</div>
    <div class="popup-text" id="successText">Action completed.</div>
  </div>
</div>

<!-- Firebase + Admin logic -->
<script type="module" src="./firebase.js"></script>
<script type="module" src="./admin.js"></script>

</body>
</html>

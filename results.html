<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Election Results - Rongo University</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: #050814;
      --accent: #1e90ff;
      --accent-strong: #4cc3ff;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-soft: #1f2937;
    }
    body {
      margin:0; font-family:system-ui,sans-serif;
      background:radial-gradient(circle at top,#0b1530 0,#050814 45%,#02030a 100%);
      color:var(--text-main); padding:20px;
    }
    h1 { text-align:center; color:var(--accent-strong); }
    .card {
      background:#020617; border:1px solid var(--border-soft);
      border-radius:14px; padding:20px; margin:20px auto;
      max-width:600px; box-shadow:0 18px 40px rgba(0,0,0,0.7);
    }
    .seat-title { font-size:15px; font-weight:600; color:var(--accent-strong); margin-bottom:8px; }
    .candidate { display:flex; justify-content:space-between; margin:6px 0; font-size:13px; }
    .count { color:var(--text-muted); }
    .btn {
      display:block; margin:20px auto; border:none; border-radius:999px; padding:10px 16px;
      font-size:14px; cursor:pointer; background:linear-gradient(135deg,#1e90ff,#4cc3ff);
      color:#020617; font-weight:600;
    }
  </style>
</head>
<body>
  <h1 id="electionTitle">Election Results</h1>
  <div id="results"></div>
  <button class="btn" onclick="goBack()">Back</button>

<script>
function goBack() {
  // Return to index page
  window.location.href = "index.html";
}

function renderResults() {
  const data = localStorage.getItem("electionData");
  if (!data) {
    document.getElementById("results").innerHTML = "<p>No election data found.</p>";
    return;
  }
  const election = JSON.parse(data);
  document.getElementById("electionTitle").innerText = election.title || "Election Results";

  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  election.seats.forEach(seat => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="seat-title">${seat.name}</div>`;
    seat.candidates.forEach(c => {
      const votes = seat.votes && seat.votes[c.id] ? seat.votes[c.id] : 0;
      const candDiv = document.createElement("div");
      candDiv.className = "candidate";
      candDiv.innerHTML = `<span>${c.name}</span><span class="count">${votes} votes</span>`;
      card.appendChild(candDiv);
    });
    resultsDiv.appendChild(card);
  });
}

renderResults();
</script>

<script type="module" src="./firebase.js"></script>
<script type="module" src="./results.js"></script>

</body>
</html>

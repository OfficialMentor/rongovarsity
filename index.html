<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rongo University Voting System</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: #050814;
      --accent: #1e90ff;
      --accent-strong: #4cc3ff;
      --text-main: #e5e7eb;
      --border-soft: #1f2937;
    }
    body {
      margin:0; font-family:system-ui,sans-serif;
      background:radial-gradient(circle at top,#0b1530 0,#050814 45%,#02030a 100%);
      color:var(--text-main); min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .topbar {
      position:absolute; top:10px; left:10px;
    }
    .btn-small {
      border:1px solid var(--accent); background:transparent; color:var(--accent-strong);
      padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px;
    }
    .card {
      background:#020617; border:1px solid var(--border-soft);
      border-radius:14px; padding:30px; width:320px;
      box-shadow:0 18px 40px rgba(0,0,0,0.7); text-align:center;
    }
    h1 { font-size:20px; color:var(--accent-strong); margin-bottom:20px; }
    .btn {
      width:100%; border:none; border-radius:999px; padding:12px;
      font-size:14px; cursor:pointer; background:linear-gradient(135deg,#1e90ff,#4cc3ff);
      color:#020617; font-weight:600; margin-top:14px;
    }
  </style>
</head>
<body>
  <!-- Admin Login button in top-left -->
  <div class="topbar">
    <button class="btn-small" onclick="goAdmin()">Admin Login</button>
  </div>

  <div class="card">
    <h1>Rongo University Voting</h1>
    <button class="btn" onclick="goVoter()">Voter Login</button>
    <button class="btn" onclick="goResults()">View Results</button>
  </div>

<script>
function goVoter() {
  window.location.href = "login.html";   // student login page
}
function goResults() {
  window.location.href = "results.html"; // results page
}
function goAdmin() {
  window.location.href = "admin.html";   // admin panel
}
</script>
</body>
</html>

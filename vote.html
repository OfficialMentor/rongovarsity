<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cast Your Vote - Rongo University</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: #050814;
      --accent: #1e90ff;
      --accent-strong: #4cc3ff;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-soft: #1f2937;
      --danger: #ff4b5c;
    }
    body {
      margin:0; font-family:system-ui,sans-serif;
      background:radial-gradient(circle at top,#0b1530 0,#050814 45%,#02030a 100%);
      color:var(--text-main); padding:20px;
    }
    h1 { text-align:center; color:var(--accent-strong); }
    .card { background:#020617; border:1px solid var(--border-soft); border-radius:14px; padding:20px; margin:20px auto; max-width:500px; box-shadow:0 18px 40px rgba(0,0,0,0.7); }
    .seat-title { font-size:15px; font-weight:600; color:var(--accent-strong); margin-bottom:8px; }
    .candidate { margin:6px 0; }
    label { cursor:pointer; }
    .btn { width:100%; border:none; border-radius:999px; padding:10px; font-size:14px; cursor:pointer; background:linear-gradient(135deg,#1e90ff,#4cc3ff); color:#020617; font-weight:600; margin-top:14px; }
    /* POPUP */
    .popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.25s; z-index:999; }
    .popup-overlay.show { opacity:1; pointer-events:auto; }
    .popup { background:#020617; border:1px solid var(--accent); border-radius:14px; padding:20px; width:280px; text-align:center; transform:scale(0.8); opacity:0; transition:0.25s; }
    .popup.show { transform:scale(1); opacity:1; }
    .popup-icon { font-size:28px; margin-bottom:8px; }
    .popup-title { font-size:15px; font-weight:600; margin-bottom:4px; }
    .popup-text { font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  </style>
</head>
<body>
  <h1 id="electionTitle">Election Ballot</h1>
  <div id="ballot"></div>
  <button class="btn" onclick="submitVote()">Submit Vote</button>

  <!-- POPUP -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popupBox">
      <div class="popup-icon" id="popupIcon">✔</div>
      <div class="popup-title" id="popupTitle">Message</div>
      <div class="popup-text" id="popupText">Details here.</div>
    </div>
  </div>

<script>
function showPopup(success, title, text) {
  const icon = document.getElementById("popupIcon");
  icon.textContent = success ? "✔" : "✘";
  icon.style.color = success ? getComputedStyle(document.documentElement).getPropertyValue("--accent-strong").trim()
                             : getComputedStyle(document.documentElement).getPropertyValue("--danger").trim();
  document.getElementById("popupTitle").innerText = title;
  document.getElementById("popupText").innerText = text;
  const overlay = document.getElementById("popupOverlay");
  const box = document.getElementById("popupBox");
  overlay.classList.add("show"); box.classList.add("show");
  setTimeout(() => { overlay.classList.remove("show"); box.classList.remove("show"); }, 1500);
}

const data = localStorage.getItem("electionData");
const adm = localStorage.getItem("currentVoter");
if (!data || !adm) {
  showPopup(false,"Access Denied","No voter session found.");
  setTimeout(()=>{ window.location.href="login.html"; },1500);
}
const election = JSON.parse(data);
const voter = election.voters.find(v => v.admission === adm);
if (!voter) {
  showPopup(false,"Access Denied","Voter not found.");
  setTimeout(()=>{ window.location.href="login.html"; },1500);
}

// If password is still UNSET, force voter to create one
if (voter.password === "UNSET") {
  document.getElementById("ballot").innerHTML = `
    <div class="card">
      <div class="seat-title">Create Your Account Password</div>
      <input type="password" id="newPass" placeholder="Enter new password" required>
      <button class="btn" onclick="setPassword()">Save Password</button>
    </div>`;
} else {
  renderBallot();
}

function setPassword() {
  const newPass = document.getElementById("newPass").value.trim();
  if (!newPass) { showPopup(false,"Error","Password is required."); return; }
  voter.password = newPass;
  saveElection();
  showPopup(true,"Password Set","You can now vote.");
  setTimeout(()=>{ renderBallot(); },1500);
}

function renderBallot() {
  document.getElementById("ballot").innerHTML = "";
  election.seats.forEach(seat => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="seat-title">${seat.name}</div>`;
    seat.candidates.forEach(c => {
      const candDiv = document.createElement("div");
      candDiv.className = "candidate";
      candDiv.innerHTML = `<label><input type="radio" name="${seat.id}" value="${c.id}" required> ${c.name}</label>`;
      card.appendChild(candDiv);
    });
    document.getElementById("ballot").appendChild(card);
  });
}

function submitVote() {
  if (voter.hasVoted) { showPopup(false,"Access Denied","You have already voted."); return; }
  election.seats.forEach(seat => {
    const choice = document.querySelector(`input[name="${seat.id}"]:checked`);
    if (choice) {
      if (!seat.votes) seat.votes = {};
      if (!seat.votes[choice.value]) seat.votes[choice.value] = 0;
      seat.votes[choice.value]++;
    }
  });
  voter.hasVoted = true;
  saveElection();
  showPopup(true,"Vote Submitted","Thank you for voting.");
  setTimeout(()=>{ window.location.href="results.html"; },1500);
}

function saveElection() {
  localStorage.setItem("electionData", JSON.stringify(election));
}
</script>

<script type="module" src="./firebase.js"></script>
<script type="module" src="./vote.js"></script>

</body>
</html>
